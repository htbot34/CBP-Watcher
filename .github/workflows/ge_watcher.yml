name: Global Entry Watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking for openings"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    # A single check takes seconds. This is a backstop: if the script ever
    # ends up in its local polling loop here, the job dies in 5 minutes
    # instead of burning the runner's 6-hour default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: ge_watcher_state.json
          key: ge-state-${{ github.run_id }}
          restore-keys: ge-state-

      - name: Check for openings
        env:
          # Sender is the same address the alerts go to, which is already in
          # this repo — only the app password needs to be a secret.
          SMTP_USER: henrylachtur@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: henrylachtur@gmail.com
        run: python3 global_entry_watcher.py ${{ inputs.test_email && '--test-email' || '--once' }}
