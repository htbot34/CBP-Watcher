name: Global Entry Watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: ge_watcher_state.json
          key: ge-state-${{ github.run_id }}
          restore-keys: ge-state-

      - name: Check for openings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: henrylachtur@gmail.com
        run: python3 global_entry_watcher.py --once
